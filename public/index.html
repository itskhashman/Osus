<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OSUS Alroqey Ltd. Co.</title>
    <meta http-equiv="refresh" content="0; url=./en/" />
    <script>
      // Paths are relative so this works under any basePath (e.g. /Osus/).
      var locale =
        (navigator.language || "en").toLowerCase().indexOf("ar") === 0
          ? "ar"
          : "en";
      location.replace("./" + locale + "/");
    </script>
  </head>
  <body>
    <a href="./en/">Continue to the OSUS website</a>
  </body>
</html>
